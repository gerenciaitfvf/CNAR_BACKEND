# =====================================================================
# nginx site - CNAR Margarita PMS
# Sirve el frontend estatico y hace proxy de /api al backend Express.
# Las variables __APP_DIR__, __BACKEND_PORT__ y __PUBLIC_HOST__
# se sustituyen en deploy.sh.
# =====================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PUBLIC_HOST__ _;

    # El dist se copia a /var/www/cnar (ver deploy.sh) para evitar el
    # AppArmor de nginx en Ubuntu que bloquea lecturas fuera de /var/www.
    root /var/www/cnar;
    index index.html;

    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/cnar.access.log;
    error_log  /var/log/nginx/cnar.error.log;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Frontend SPA: todo lo no-API va al index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estaticos con cache agresivo (vite pone hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API -> backend (PM2 en :4000)
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout  300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  300s;
    }

    # Health check publico
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Ocultar version de nginx
    server_tokens off;
}
